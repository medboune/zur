<style>
/* ═══ TOKENS — adopted system + corrections ═══ */
:root{
  /* Core surfaces (84% of canvas) */
  --bg:#05070B; --surface:#0A1019; --surface-2:#0E1621;
  --border:#1B2A3A; --border-2:#2A3F55;
  /* Brand — CYAN: action/infrastructure · VIOLET: AI/agents */
  --cyan:#18E0FF; --cyan-dark:#06B6D4; --cyan-soft:#9BE5FF;
  --violet:#7C5CFF; --violet-soft:#A79BFF;
  /* Typography */
  --text:#F5F8FC; --text-muted:#94A3B8; --text-dim:#7D8AA3;
  /* Status — GREEN live · AMBER official/attention · RED errors only */
  --success:#22E68A; --gold:#FFB547; --danger:#FF4D67;
  /* Effects */
  --glow-cyan:0 0 40px rgba(24,224,255,.18);
  --glow-violet:0 0 40px rgba(124,92,255,.15);
  /* Gradients — brand: text/decor ONLY · action: buttons (AA-safe) */
  --gradient-brand:linear-gradient(135deg,#18E0FF 0%,#367CFF 50%,#7C5CFF 100%);
  --grad:linear-gradient(135deg,#18E0FF 0%,#367CFF 50%,#7C5CFF 100%);
  --grad-action:linear-gradient(180deg,#18E0FF,#06B6D4);
  --grad-violet:linear-gradient(180deg,#9D7BFF,#7C5CFF);
  --r:8px; --r-sm:6px;
  --font:'Manrope',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --disp:'Space Grotesk','Manrope',ui-sans-serif,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--text-muted);font-size:1rem;line-height:1.65;-webkit-font-smoothing:antialiased}
::selection{background:rgba(24,224,255,.3);color:#fff}
::-webkit-scrollbar{width:10px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:6px}
::-webkit-scrollbar-track{background:transparent}
img,svg{display:block}
a{color:inherit;text-decoration:none}
ul{list-style:none}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;border-radius:4px}
.skip-link{position:absolute;left:-9999px;top:0;background:var(--cyan);color:#041019;padding:8px 16px;border-radius:0 0 8px 0;z-index:200;font-weight:700}
.skip-link:focus{left:0}
.container{max-width:1280px;margin:0 auto;padding:0 24px}
.icon{width:24px;height:24px;flex:none}
.ic-s{width:15px;height:15px}
.ic-m{width:20px;height:20px}
h1,h2,h3,h4{color:var(--text);font-family:var(--disp);letter-spacing:-.02em;line-height:1.18;font-weight:700}
a.card:hover,a.scn-card:hover{transform:translateY(-2px)}
#main.page-in{animation:pageIn .4s cubic-bezier(.22,.61,.36,1) both}
@keyframes pageIn{from{opacity:0;transform:translateY(8px)}}
.mono-label{font-family:var(--mono);font-size:.64rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--cyan-soft)}

/* ═══ AMBIENT ═══ */
.bg-art{position:fixed;inset:0;z-index:-1;background:radial-gradient(900px 480px at 80% -10%,rgba(24,224,255,.06),transparent 60%),radial-gradient(900px 540px at 10% 110%,rgba(124,92,255,.05),transparent 60%),var(--bg);animation:bgdrift 30s ease-in-out infinite alternate}
@keyframes bgdrift{to{background-position:30px 20px,-24px -16px,0 0}}
.bg-art::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(148,163,184,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(148,163,184,.04) 1px,transparent 1px);background-size:56px 56px;-webkit-mask-image:radial-gradient(ellipse 95% 72% at 50% 0%,#000 0%,transparent 78%);mask-image:radial-gradient(ellipse 95% 72% at 50% 0%,#000 0%,transparent 78%)}

/* ═══ CONTROLS ═══ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:inherit;font-weight:700;font-size:.92rem;padding:10px 20px;border-radius:var(--r-sm);border:1px solid transparent;cursor:pointer;transition:transform .15s,box-shadow .15s,filter .15s,border-color .15s,color .15s,background .15s;white-space:nowrap}
.btn:active{transform:none}
.btn-primary{background:var(--grad-action);color:#041019;box-shadow:0 0 24px rgba(24,224,255,.22),0 1px 3px rgba(1,4,9,.5)}
.btn-primary:hover{filter:brightness(1.08);transform:translateY(-1px);box-shadow:0 0 36px rgba(24,224,255,.34),0 3px 10px rgba(1,4,9,.5)}
.btn-outline{background:var(--surface-2);color:var(--text);border-color:var(--border-2)}
.btn-outline:hover{border-color:#415E80;background:#121C2A;transform:translateY(-1px)}
.btn-ghostd{background:transparent;color:var(--text);border-color:var(--border-2)}
.btn-ghostd:hover{border-color:#415E80;color:var(--cyan-soft)}
.btn-sm{padding:5px 14px;font-size:.85rem;border-radius:var(--r-sm)}
.btn-row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.tlink{color:var(--cyan-soft);font-weight:700;font-size:.92rem;display:inline-flex;align-items:center;gap:6px;transition:gap .2s,color .2s}
.tlink:hover{gap:10px;color:#C6F1FF}
.tlink .icon{width:15px;height:15px}
.chip{display:inline-flex;align-items:center;gap:7px;background:rgba(24,224,255,.08);color:var(--cyan-soft);border:1px solid rgba(24,224,255,.25);font-family:var(--mono);font-weight:500;font-size:.7rem;letter-spacing:.05em;padding:4px 12px;border-radius:999px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--cyan);flex:none}
.seal{display:inline-flex;align-items:center;gap:8px;background:rgba(255,181,71,.07);border:1px solid rgba(255,181,71,.4);color:var(--gold);font-family:var(--mono);font-size:.64rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:6px 14px;border-radius:999px}
.seal .icon{width:13px;height:13px}
.seal-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.term-live{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:.64rem;font-weight:700;letter-spacing:.18em;color:var(--success)}
.term-live .dot{background:var(--success);box-shadow:0 0 8px rgba(34,230,138,.8);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}

/* ═══ SECTIONS ═══ */
.section{padding:64px 0}
.section--white{background:#070B12;border-block:1px solid #131F2E}
.section--tint{background:linear-gradient(180deg,rgba(24,224,255,.045),rgba(124,92,255,.035))}
.section--dark{background:#030508;border-block:1px solid #14202F}
.eyebrow{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:.68rem;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--cyan-soft)}
.eyebrow::before{content:"";width:8px;height:8px;background:var(--grad);border-radius:2px;flex:none}
.eyebrow--center{justify-content:center}
.eyebrow--center::after{content:"";width:8px;height:8px;background:var(--grad);border-radius:2px;flex:none}
.h2{font-size:clamp(1.6rem,2.9vw,2.15rem);margin:14px 0 12px}
.sec-head{max-width:640px;margin-bottom:36px}
.sec-head--center{margin-inline:auto;text-align:center}
.sec-lede{font-size:1.02rem;color:var(--text-dim)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}

/* ═══ CARDS (semantic: .v = AI → violet) ═══ */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:20px;transition:transform .2s,border-color .2s;display:block;position:relative}
.card::before,.entry-card::before,.scope-group::before,.scn-card::before,.b-cell::before,.tech::before{content:"";position:absolute;inset:0;border-radius:inherit;opacity:0;transition:opacity .3s;background:radial-gradient(400px circle at var(--mx,50%) var(--my,50%),rgba(24,224,255,.07),transparent 45%);pointer-events:none}
.card:hover::before,.entry-card:hover::before,.scope-group:hover::before,.scn-card:hover::before,.b-cell:hover::before,.tech:hover::before{opacity:1}
.card:hover{border-color:var(--border-2)}
.card h3{font-size:1.02rem;margin:14px 0 7px}
.card p{font-size:.9rem;color:var(--text-dim)}
.tile{width:42px;height:42px;border-radius:var(--r-sm);background:rgba(24,224,255,.09);color:var(--cyan-soft);display:grid;place-items:center;transition:background .25s,color .25s}
.tile .icon{width:20px;height:20px}
.card:hover .tile,.b-cell:hover .tile{background:var(--grad-action);color:#041019}
.card.v .tile,.b-cell.v .tile{background:rgba(124,92,255,.14);color:var(--violet-soft)}
.card.v:hover .tile,.b-cell.v:hover .tile{background:var(--grad-violet);color:#0A0A16}
.card.v:hover::before,.b-cell.v:hover::before{background:radial-gradient(400px circle at var(--mx,50%) var(--my,50%),rgba(124,92,255,.08),transparent 45%)}
.card--featured{border-color:rgba(24,224,255,.4);background:linear-gradient(180deg,rgba(24,224,255,.06),var(--surface))}
.kicker{font-family:var(--mono);font-size:.66rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--cyan-soft)}

/* ═══ HEADER ═══ */
.site-header{position:fixed;inset:0 0 auto 0;z-index:100;background:#04060B;border-bottom:1px solid var(--border)}
.header-inner{display:flex;align-items:center;gap:22px;height:62px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--disp);font-weight:700;font-size:1.15rem;color:var(--text);letter-spacing:-.02em}
.brand-mark{width:32px;height:32px;filter:drop-shadow(0 0 8px rgba(24,224,255,.18))}
.main-nav{display:flex;align-items:center;gap:2px;margin-left:auto}
.nav-link{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;font-weight:600;font-size:.9rem;color:var(--text-muted);border-radius:var(--r-sm);background:none;border:none;font-family:inherit;cursor:pointer;position:relative;transition:color .15s,background .15s}
.nav-link:hover{color:var(--text);background:rgba(148,163,184,.1)}
.nav-link.active{color:var(--text)}
.nav-link.active::after{content:"";position:absolute;left:10px;right:10px;bottom:2px;height:2px;border-radius:2px;background:var(--grad)}
.ir-dot{width:6px;height:6px;border-radius:50%;background:var(--success)}
.header-actions{display:flex;align-items:center;gap:10px}
.nav-toggle{display:none;width:38px;height:38px;border:1px solid var(--border-2);border-radius:var(--r-sm);background:var(--surface);color:var(--text);cursor:pointer;place-items:center}
.nav-dd{position:relative}
.dd-panel{position:absolute;top:calc(100% + 8px);left:50%;transform:translateX(-50%);width:min(980px,94vw);background:var(--surface-2);border:1px solid var(--border-2);border-radius:var(--r);box-shadow:0 16px 40px rgba(1,4,9,.7);padding:20px;display:grid;grid-template-columns:repeat(5,1fr);gap:18px}
.dd-panel::before{content:"";position:absolute;top:-14px;left:0;right:0;height:14px}
.dd-panel[hidden]{display:none}
.dd-g h4{font-family:var(--mono);font-size:.62rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--cyan-soft);margin-bottom:8px;padding-bottom:7px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.dd-g h4 .icon{width:13px;height:13px}
.dd-g a{display:block;font-size:.84rem;font-weight:600;color:var(--text-muted);padding:4px 0}
.dd-g a:hover{color:var(--cyan-soft)}
.dd-foot{grid-column:1/-1;border-top:1px solid var(--border);padding-top:12px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.dd-foot span{font-size:.82rem;color:var(--text-dim)}
.mobile-nav{position:fixed;inset:62px 0 0 0;z-index:99;background:var(--bg);overflow-y:auto;padding:24px 24px 60px;display:none}
.mobile-nav.open{display:block}
.m-group{margin-bottom:18px}
.m-group h4{font-family:var(--mono);font-size:.62rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--cyan-soft);margin-bottom:7px}
.m-group a{display:block;padding:7px 0;font-weight:600;color:var(--text);border-bottom:1px solid #131F2E}
.m-pages{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.m-pages a{border:1px solid var(--border-2);padding:8px 14px;border-radius:var(--r-sm);font-weight:700;font-size:.88rem;color:var(--text)}
body.locked{overflow:hidden}

/* ═══ HERO + TERMINAL ═══ */
.hero{padding:118px 0 64px}
.hero-grid{display:grid;grid-template-columns:1.02fr .98fr;gap:48px;align-items:center}
.hero h1{font-size:clamp(2.3rem,4.6vw,3.4rem);line-height:1.08;letter-spacing:-.03em;margin:16px 0 14px;color:var(--text)}
.hero h1 em{font-style:normal;background:var(--grad);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;animation:shimmer 6s linear infinite}
@keyframes shimmer{to{background-position:-220% 0}}
.gold-rule{display:block;width:52px;height:2px;background:var(--grad);border-radius:2px;margin:0 0 20px;position:relative;overflow:hidden}
.gold-rule::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);transform:translateX(-120%);animation:sweep 3.6s ease-in-out infinite}
@keyframes sweep{45%{transform:translateX(120%)}}
.hero-lede{font-size:1.08rem;color:var(--text-muted);max-width:34rem;margin-bottom:26px}
.hero-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:22px;font-size:.86rem;color:var(--text-dim);font-weight:600}
.hero-meta .icon{width:15px;height:15px;color:var(--success)}
.hero-meta b{color:var(--text)}
.terminal{background:#04060B;border:1px solid var(--border-2);border-radius:var(--r);box-shadow:0 8px 28px rgba(1,4,9,.6),0 0 44px rgba(24,224,255,.12);overflow:hidden}
.term-head{display:flex;align-items:center;gap:12px;padding:11px 16px;background:var(--surface-2);border-bottom:1px solid var(--border);font-family:var(--mono);font-size:.72rem;color:var(--text-dim)}
.term-dots{display:flex;gap:6px}
.term-dots i{width:10px;height:10px;border-radius:50%}
.term-dots i:nth-child(1){background:var(--danger)}.term-dots i:nth-child(2){background:var(--gold)}.term-dots i:nth-child(3){background:var(--success)}
.term-title{letter-spacing:.08em}
.term-live{margin-left:auto}
.term-body{padding:14px 16px;font-family:var(--mono);font-size:.78rem;line-height:1.8;height:290px;overflow:hidden;position:relative;-webkit-mask-image:linear-gradient(180deg,#000 84%,transparent 100%);mask-image:linear-gradient(180deg,#000 84%,transparent 100%)}
.term-body::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.02) 0 1px,transparent 1px 3px);pointer-events:none}
.term-line{white-space:pre-wrap;word-break:break-word}
.t-dim{color:#5C6B82}.t-txt{color:#C9D5E4}.t-ok{color:var(--success)}.t-ai{color:var(--violet-soft)}.t-id{color:var(--cyan-soft)}.t-warn{color:var(--gold)}
.cursor{display:inline-block;width:8px;height:14px;background:var(--success);margin-left:2px;vertical-align:-2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.term-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:12px 16px;background:var(--surface-2);border-top:1px solid var(--border)}
.term-stats b{display:block;font-family:var(--mono);font-size:1.05rem;font-weight:700;color:var(--cyan)}
.term-stats span{display:block;font-family:var(--mono);font-size:.58rem;letter-spacing:.12em;text-transform:uppercase;color:var(--text-dim);margin-top:2px}

/* ═══ TRUST BAND ═══ */
.stats-band{padding:40px 0;border-block:1px solid #131F2E;background:linear-gradient(90deg,rgba(24,224,255,.05),rgba(124,92,255,.04))}
.stats-head{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.stats-head p{font-family:var(--mono);font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;color:var(--text-dim)}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.stat{padding:16px 18px;border-radius:var(--r-sm);background:var(--surface);border:1px solid var(--border);position:relative;overflow:hidden}
.stat::after{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--grad)}
.stat b{display:block;font-family:var(--mono);font-size:1.8rem;font-weight:700;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;line-height:1.25}
.stat span{display:block;font-family:var(--mono);font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:var(--text-dim);margin-top:4px}

/* ═══ BENTO ═══ */
.bento{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.b-cell{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:18px;position:relative;transition:transform .2s,border-color .2s}
.b-cell:hover{transform:translateY(-2px);border-color:var(--border-2)}
.b-cell h3{font-size:1rem;margin:12px 0 6px}
.b-cell p{font-size:.88rem;color:var(--text-dim)}
.b-mesh{grid-column:span 2;grid-row:span 2;display:flex;flex-direction:column}
.b-mesh-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.b-mesh-svg{flex:1;display:flex;align-items:center}
.b-mesh-svg svg{width:100%;height:auto;max-height:320px}
.b-mesh-foot{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.b-wide{grid-column:span 2}
.b-cta{border-color:rgba(24,224,255,.4);background:linear-gradient(180deg,rgba(24,224,255,.08),rgba(124,92,255,.06))}
.b-cta h3{margin:8px 0 6px}

/* ═══ TECH GRID ═══ */
.tech-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.tech{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);padding:12px 14px;display:flex;gap:12px;align-items:center;position:relative;transition:transform .2s,border-color .2s}
.tech:hover{transform:translateY(-2px);border-color:var(--border-2)}
.tech-mono{width:38px;height:38px;flex:none;border-radius:var(--r-sm);border:1px solid rgba(24,224,255,.35);background:rgba(24,224,255,.1);color:var(--cyan-soft);display:grid;place-items:center;font-family:var(--mono);font-weight:700;font-size:.64rem;letter-spacing:.03em}
.tech b{display:block;font-size:.86rem;color:var(--text);font-weight:700;line-height:1.3}
.tech span{display:block;font-size:.72rem;color:var(--text-dim)}
.tech-note{font-size:.78rem;color:var(--text-dim);margin-top:16px}

.flow{stroke-dasharray:2 9;animation:dash 1.1s linear infinite}
@keyframes dash{to{stroke-dashoffset:-11}}
.ring{animation:spin 110s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
.halo{transform-box:fill-box;transform-origin:center;animation:halo 2.6s ease-out infinite}
@keyframes halo{0%{transform:scale(1);opacity:.5}70%{transform:scale(2.4);opacity:0}100%{transform:scale(2.4);opacity:0}}
.node{filter:drop-shadow(0 6px 14px rgba(1,4,9,.6))}
svg text{font-family:var(--font)}

/* ═══ LISTS / STEPS / FLOW ═══ */
.check-list li{display:flex;gap:10px;align-items:flex-start;padding:6px 0;font-weight:600;color:var(--text);font-size:.93rem}
.check-list .icon{width:16px;height:16px;color:var(--success);margin-top:4px}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.step{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:20px}
.step-num{font-family:var(--mono);font-size:1.7rem;font-weight:700;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;letter-spacing:-.02em}
.step h3{margin:8px 0 6px;font-size:1rem}
.step p{font-size:.88rem;color:var(--text-dim)}
.gflow{display:flex;flex-direction:column;align-items:stretch;max-width:400px;margin:0 auto}
.gnode{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);padding:11px 18px;font-weight:700;color:var(--text)}
.gnode .tile{width:34px;height:34px;border-radius:var(--r-sm);background:rgba(24,224,255,.12);color:var(--cyan-soft)}
.gnode .tile .icon{width:17px;height:17px}
.gnode--end{background:var(--grad);color:#041019;border:none}
.gnode--end .tile{background:rgba(4,16,26,.16);color:#041019}
.glink{width:2px;height:22px;background:linear-gradient(180deg,rgba(24,224,255,.8),rgba(124,92,255,.85));margin:0 auto;position:relative;border-radius:2px}
.glink::after{content:"";position:absolute;bottom:-1px;left:50%;transform:translateX(-50%);border:5px solid transparent;border-top:6px solid var(--cyan)}

/* ═══ SCENARIO / ENTRY ═══ */
.scn-card{background:var(--surface);border:1px solid var(--border);border-left:3px solid rgba(24,224,255,.55);border-radius:var(--r-sm);padding:20px;transition:transform .2s,border-color .2s;display:block;position:relative}
.scn-card:hover{border-color:var(--border-2);border-left-color:var(--cyan)}
.scn-card h3{font-size:1.05rem;margin-bottom:7px;line-height:1.45;font-weight:600;letter-spacing:-.01em}
.scn-card p{font-size:.86rem;color:var(--text-dim);margin-bottom:12px}
.scn-card .tlink{font-size:.84rem}
.entry-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:24px;transition:transform .2s,border-color .2s;display:block;position:relative}
.entry-card:hover{transform:translateY(-3px);border-color:rgba(24,224,255,.5)}
.entry-card h3{font-size:1.22rem;margin:12px 0 5px}
.entry-card .sub{font-family:var(--mono);font-size:.68rem;font-weight:700;color:var(--cyan-soft);text-transform:uppercase;letter-spacing:.12em}
.entry-card p{font-size:.92rem;color:var(--text-dim);margin-bottom:14px}
.ir-strip{margin-top:20px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;background:var(--surface);border:1px dashed var(--border-2);border-radius:var(--r-sm);padding:14px 20px}
.ir-strip p{font-weight:700;color:var(--text);font-size:.93rem}
.group-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:18px;transition:transform .2s,border-color .2s}
.group-card:hover{transform:translateY(-2px);border-color:var(--border-2)}
.group-card h3{font-size:.96rem;margin:10px 0 8px;display:flex;gap:9px;align-items:center}
.group-card.v h3 .icon{color:var(--violet-soft)}
.group-card a{display:block;font-size:.84rem;font-weight:600;color:var(--text-muted);padding:3px 0}
.group-card a:hover{color:var(--cyan-soft)}
.ind-chips{display:flex;flex-wrap:wrap;gap:10px}
.ind-chips a{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:8px 16px;font-weight:700;font-size:.86rem;color:var(--text);transition:.2s}
.ind-chips a:hover{border-color:var(--cyan);color:var(--cyan-soft);background:rgba(24,224,255,.07)}
.note{background:rgba(24,224,255,.06);border:1px solid #1E2C40;border-left:3px solid var(--cyan);border-radius:var(--r-sm);padding:16px 20px;font-size:.9rem;color:#C3CCDA}
.note b{color:var(--text)}
.note li .icon{color:var(--success)}
.del-panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:24px}
.del-panel h3{margin-bottom:8px;display:flex;gap:9px;align-items:center}
.lifecycle{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:.78rem;font-weight:500}
.lifecycle span{background:var(--surface);border:1px solid var(--border);padding:6px 13px;border-radius:999px;color:var(--text);font-family:var(--mono)}
.lifecycle i{color:var(--cyan-soft);font-style:normal;font-weight:700}

/* ═══ PAGE HERO ═══ */
.page-hero{padding:112px 0 48px;background:radial-gradient(800px 360px at 85% -18%,rgba(24,224,255,.07),transparent 62%)}
.page-hero h1{font-size:clamp(1.9rem,3.8vw,2.7rem);margin:14px 0 14px;max-width:22ch}
.page-hero .lede{font-size:1.06rem;max-width:44rem;color:var(--text-muted)}
.page-hero--dark{background:radial-gradient(900px 400px at 85% -20%,rgba(54,124,255,.14),transparent 60%),linear-gradient(180deg,rgba(24,224,255,.05) 0%,transparent 78%)}
.crumb{font-size:.84rem;font-weight:600;color:var(--text-dim);display:inline-flex;gap:8px;align-items:center;margin-bottom:14px}
.crumb:hover{color:var(--cyan-soft)}
.two-col{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:start}
.scope-group{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:20px;position:relative}
.scope-group h3{font-size:.96rem;margin-bottom:5px;display:flex;align-items:center;gap:9px}
.fit-list li{padding:7px 0;border-bottom:1px solid #131F2E;font-weight:600;color:var(--text);font-size:.93rem;display:flex;gap:10px}
.fit-list .icon{color:var(--cyan-soft);margin-top:4px}

/* ═══ FORM ═══ */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.field{display:flex;flex-direction:column;gap:6px}
.field--full{grid-column:1/-1}
.field label{font-weight:700;font-size:.86rem;color:var(--text)}
.field label i{font-style:normal;color:var(--cyan-soft)}
.field input,.field select,.field textarea{font-family:inherit;font-size:.94rem;font-weight:500;color:var(--text);background:var(--surface);border:1px solid var(--border-2);border-radius:var(--r-sm);padding:10px 14px;transition:border-color .15s,box-shadow .15s;width:100%}
.field textarea{min-height:120px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 0 3px rgba(24,224,255,.16)}
.field .err{color:var(--danger);font-size:.78rem;font-weight:700;display:none}
.field.invalid input,.field.invalid select,.field.invalid textarea{border-color:var(--danger)}
.field.invalid .err{display:block}
.hp{position:absolute;left:-9999px;opacity:0;height:0;overflow:hidden}
.form-note{font-size:.8rem;color:var(--text-dim);margin-top:12px}
.success-card{background:rgba(34,230,138,.07);border:1px solid rgba(34,230,138,.3);border-radius:var(--r);padding:32px;text-align:center}
.success-card .icon{width:44px;height:44px;color:var(--success);margin:0 auto 12px}
.contact-aside{background:var(--surface);border:1px solid var(--border);color:var(--text-muted);border-radius:var(--r);padding:28px}
.contact-aside h3{color:var(--text);margin-bottom:12px}
.contact-aside li{display:flex;gap:10px;padding:8px 0;font-size:.9rem;align-items:flex-start}
.contact-aside .icon{color:var(--cyan-soft);margin-top:3px;width:16px;height:16px}

/* ═══ FOOTER ═══ */
.site-footer{background:#030508;position:relative;border-top:1px solid var(--border)}
.site-footer::before{content:"";position:absolute;top:-1px;left:0;right:0;height:2px;background:var(--grad)}
.footer-grid{display:grid;grid-template-columns:1.5fr 1fr 1fr 1.1fr;gap:36px;padding:52px 0 40px;color:var(--text-dim)}
.footer-brand .brand{color:var(--text);margin-bottom:14px}
.footer-brand p{font-size:.88rem;max-width:30rem}
.footer-tagline{font-family:var(--mono);font-weight:700;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;letter-spacing:.08em;font-size:.74rem;margin-top:14px;text-transform:uppercase}
.footer-col h4{font-family:var(--mono);color:var(--text);font-size:.64rem;letter-spacing:.16em;text-transform:uppercase;margin-bottom:12px}
.footer-col a{display:block;padding:4px 0;font-size:.88rem;font-weight:600}
.footer-col a:hover{color:var(--cyan-soft)}
.footer-bottom{border-top:1px solid #131F2E;padding:18px 0;display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;font-size:.8rem}
.footer-bottom .links{display:flex;gap:18px}
.footer-bottom a:hover{color:var(--cyan-soft)}

/* ═══ MOTION ═══ */
.reveal{opacity:0;transform:translateY(18px);transition:opacity .5s ease,transform .5s cubic-bezier(.22,.61,.36,1);transition-delay:var(--d,0s)}
.reveal.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){
  .reveal{opacity:1;transform:none;transition:none}
  .flow,.ring,.halo,.bg-art,.term-live .dot,.cursor{animation:none}
  .hero h1 em{animation:none}
  .gold-rule::after{content:none}
  #main.page-in{animation:none}
  *{scroll-behavior:auto}
}

/* ═══ RESPONSIVE ═══ */
@media (max-width:1080px){
  .main-nav{display:none}
  .nav-toggle{display:grid}
  .hero-grid{grid-template-columns:1fr;gap:36px}
  .hero{padding:96px 0 56px}
  .stats-grid{grid-template-columns:repeat(2,1fr)}
  .bento{grid-template-columns:repeat(2,1fr)}
  .b-mesh{grid-column:span 2;grid-row:span 1}
  .b-mesh-svg svg{max-height:240px}
  .b-wide{grid-column:span 2}
  .tech-grid{grid-template-columns:repeat(4,1fr)}
  .steps{grid-template-columns:repeat(2,1fr)}
  .footer-grid{grid-template-columns:1fr 1fr;gap:28px}
  .two-col{grid-template-columns:1fr;gap:28px}
}
@media (max-width:900px){
  .g3{grid-template-columns:repeat(2,1fr)}
  .dd-panel{grid-template-columns:1fr 1fr}
}
@media (max-width:640px){
  .section{padding:48px 0}
  .g2,.g3,.steps,.form-grid{grid-template-columns:1fr}
  .hero{padding:86px 0 48px}
  .btn{width:100%}
  .btn-row .btn{width:100%}
  .btn-sm,.header-actions .btn{width:auto}
  .page-hero{padding:96px 0 40px}
  .ir-strip{flex-direction:column;align-items:flex-start}
  .footer-grid{grid-template-columns:1fr}
  .dd-panel{grid-template-columns:1fr}
  .bento{grid-template-columns:1fr}
  .b-mesh,.b-wide{grid-column:auto}
  .stats-grid{grid-template-columns:repeat(2,1fr)}
  .tech-grid{grid-template-columns:repeat(2,1fr)}
  .term-body{height:240px}
}
</style>
</head>

const bySlug = s => SERVICES.find(x => x.slug === s);

function ctaBand(title, body, primaryLabel, primaryHref){
  return '<section class="section section--dark"><div class="container">'+
  '<div class="sec-head sec-head--center reveal"><p class="eyebrow eyebrow--center"><span class="dot"></span>Next step</p>'+
  '<h2 class="h2">'+title+'</h2><p class="sec-lede">'+body+'</p>'+
  '<div class="btn-row" style="justify-content:center;margin-top:24px"><a class="btn btn-primary" href="'+primaryHref+'">'+primaryLabel+ic('arrowR','ic-s')+'</a>'+
  '<a class="btn btn-ghostd" href="#/services">Explore services</a></div></div></div></section>';
}
function serviceCard(s, featured){
  return '<a class="card'+(featured?' card--featured':'')+(s.g==='ai'?' v':'')+'" href="#/services/'+s.slug+'">'+
  '<div class="tile">'+ic(s.icon)+'</div>'+(featured?'<p class="kicker" style="margin-top:12px">Start here</p>':'')+
  '<h3>'+s.t+'</h3><p>'+s.short+'</p>'+
  '<p class="tlink" style="margin-top:12px">Learn more '+ic('arrowR')+'</p></a>';
}
function stepsHtml(steps){
  return '<div class="steps">'+steps.map((st,i)=>'<div class="step reveal" style="--d:'+(i*0.08)+'s"><div class="step-num">0'+(i+1)+'</div><h3>'+st[0]+'</h3><p>'+st[1]+'</p></div>').join('')+'</div>';
}
function relatedHtml(rel){
  return '<div class="grid g3">'+rel.map(r=>{const x=bySlug(r); return x?'<a class="card'+(x.g==='ai'?' v':'')+'" href="#/services/'+x.slug+'"><div class="tile">'+ic(x.icon)+'</div><h3>'+x.t+'</h3><p>'+x.short+'</p></a>':'';}).join('')+'</div>';
}

  }
  let li=0;
  function typeLine(){
    if(!document.body.contains(body)) return;
    const line=TERM_LINES[li%TERM_LINES.length]; li++;
    const div=document.createElement('div'); div.className='term-line';
    const span=document.createElement('span'); span.className=line.c;
    const cur=document.createElement('span'); cur.className='cursor';
    div.appendChild(span); div.appendChild(cur); body.appendChild(div);
    while(body.children.length>11) body.removeChild(body.firstChild);
    let ci=0;
    (function tick(){
      if(!document.body.contains(div)) return;
      span.textContent=line.t.slice(0,ci);
      if(ci<line.t.length){ ci++; setTimeout(tick,9); }
      else { cur.remove(); setTimeout(typeLine,430); }
    })();
  }
  typeLine();
  const ev=document.getElementById('tEvents'), dr=document.getElementById('tDrift');
  let evN=1204, drN=312;
  const fmt=v=>v.toLocaleString('en-US');
  if(ev&&dr){
    ev.textContent=fmt(evN); dr.textContent=fmt(drN);
    const iv=setInterval(()=>{
      if(!document.body.contains(ev)){ clearInterval(iv); return; }
      evN+=1+Math.floor(Math.random()*6);
      drN+=Math.random()<.4?1:0;
      ev.textContent=fmt(evN); dr.textContent=fmt(drN);
    },3200);
  }
}
function initCounters(){
  document.querySelectorAll('[data-count]').forEach(el=>{
    const raw=el.dataset.count;
    const target=parseFloat(raw);
    const dec=raw.indexOf('.')>-1?1:0;
    const suf=el.dataset.suffix||'';
    const set=v=>{ el.textContent=(dec?v.toFixed(1):Math.round(v).toLocaleString('en-US'))+suf; };
    if(RM){ set(target); return; }
    const io=new IntersectionObserver(es=>{
      es.forEach(e=>{
        if(!e.isIntersecting) return;
        io.disconnect();
        const t0=performance.now(), dur=1800;
        (function fr(now){
          const p=Math.min(1,(now-t0)/dur);
          const ease=1-Math.pow(1-p,3);
          set(target*ease);
          if(p<1) requestAnimationFrame(fr);
        })(t0);
      });
    },{threshold:.4});
    io.observe(el);
  });
}

const main=document.getElementById('main');
function initReveal(){
  if(!('IntersectionObserver' in window)){document.querySelectorAll('.reveal').forEach(n=>n.classList.add('in'));return;}
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}}),{threshold:.1,rootMargin:'0px 0px -32px'});
  document.querySelectorAll('.reveal').forEach(n=>io.observe(n));
}
function updateNav(seg){
  document.querySelectorAll('.nav-link').forEach(a=>a.classList.toggle('active',a.dataset.route===seg));
}
function closeMobile(){
  document.getElementById('mobileNav').classList.remove('open');
  document.body.classList.remove('locked');
  document.getElementById('navToggle').setAttribute('aria-expanded','false');
}
function bindContactForm(){
  const form=document.getElementById('contactForm');
  if(!form) return;
  form.addEventListener('submit',e=>{
    e.preventDefault();
    if(form.company_website.value) { form.reset(); document.getElementById('formSuccess').hidden=false; form.hidden=true; return; }
    let ok=true;
    const need=(id,test)=>{const f=document.getElementById(id).closest('.field');const v=document.getElementById(id).value.trim();
      if(!test(v)){f.classList.add('invalid');ok=false;}else f.classList.remove('invalid');};
    need('f-name',v=>v.length>1);
    need('f-email',v=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v));
    need('f-company',v=>v.length>1);
    need('f-topic',v=>v!=='');
    need('f-msg',v=>v.length>4);
    if(!ok){const bad=form.querySelector('.field.invalid input,.field.invalid select,.field.invalid textarea');if(bad)bad.focus();return;}
    /* PRODUCTION: POST to your secure endpoint here. Success state below. */
    form.hidden=true;
    const s=document.getElementById('formSuccess');s.hidden=false;s.setAttribute('role','status');
    s.scrollIntoView({behavior:'smooth',block:'center'});
  });
}
function navigate(){
  const raw=location.hash.replace(/^#\/?/,'');
  const parts=raw.split('?');
  const path=parts[0];
  const segs=path.split('/').filter(Boolean);
  const params=new URLSearchParams(parts[1]||'');
  let html,title;
  if(!segs.length){html=renderHome();title='Zuronix — Cybersecurity, Risk & AI Agent Security | 24/7 Monitoring';}
  else if(segs[0]==='services'&&segs.length===1){html=renderServicesIndex();title='Services — Zuronix';}
  else if(segs[0]==='services'&&segs[1]){
    const s=bySlug(segs[1]);
    if(s&&s.slug==='incident-response'){html=renderIR();title='Incident Response — Zuronix';}
    else if(s){html=renderService(s);title=s.t+' — Zuronix';}
    else {html=render404();title='Not found — Zuronix';}
  }
  else if(segs[0]==='incident-response'){html=renderIR();title='Incident Response — Zuronix';}
  else if(segs[0]==='about'){html=renderAbout();title='About — Zuronix';}
  else if(segs[0]==='industries'){html=renderIndustries();title='Industries — Zuronix';}
  else if(segs[0]==='insights'){html=renderInsights();title='Insights — Zuronix';}
  else if(segs[0]==='contact'){html=renderContact(params.get('topic')||'');title='Contact — Zuronix';}
  else if(segs[0]==='privacy'){html=renderPrivacy();title='Privacy Policy — Zuronix';}
  else if(segs[0]==='terms'){html=renderTerms();title='Terms of Use — Zuronix';}
  else {html=render404();title='Not found — Zuronix';}
  main.innerHTML=html;
  document.title=title;
  main.classList.remove('page-in'); void main.offsetWidth; main.classList.add('page-in');
  closeMobile();
  const dd=document.getElementById('ddPanel');if(dd)dd.hidden=true;
  updateNav(segs[0]||'');
  window.scrollTo(0,0);
  main.focus({preventScroll:true});
  initReveal();
  initCounters();
  startTerminal();
  bindContactForm();
}
window.addEventListener('hashchange',navigate);

/* ═══ MODULE 8 · BEHAVIORS + BOOT ═══ */
window.addEventListener('scroll',()=>{document.getElementById('siteHeader').classList.toggle('scrolled',window.scrollY>8);},{passive:true});
(function(){
  const btn=document.getElementById('ddBtn'),panel=document.getElementById('ddPanel');
  let ddTimer=null;
  const setDD=o=>{panel.hidden=!o;btn.setAttribute('aria-expanded',o?'true':'false');};
  const openDD=()=>{clearTimeout(ddTimer);setDD(true);};
  const closeDD=()=>{clearTimeout(ddTimer);ddTimer=setTimeout(()=>setDD(false),300);};
  btn.addEventListener('click',e=>{e.stopPropagation();clearTimeout(ddTimer);setDD(panel.hidden);});
  document.addEventListener('click',e=>{if(!panel.hidden&&!panel.contains(e.target)&&!btn.contains(e.target)){clearTimeout(ddTimer);setDD(false);}});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'){clearTimeout(ddTimer);setDD(false);}});
  if(window.matchMedia('(hover:hover) and (pointer:fine)').matches){
    const wrap=btn.parentElement;
    wrap.addEventListener('mouseenter',openDD);
    wrap.addEventListener('mouseleave',closeDD);
    panel.addEventListener('mouseenter',openDD);
  }
})();
(function(){
  const t=document.getElementById('navToggle'),m=document.getElementById('mobileNav');
  t.addEventListener('click',()=>{
    const open=m.classList.toggle('open');
    document.body.classList.toggle('locked',open);
    t.setAttribute('aria-expanded',open?'true':'false');
    t.setAttribute('aria-label',open?'Close menu':'Open menu');
  });
  document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMobile();});
})();
(function(){
  if(window.matchMedia('(hover:none)').matches||RM) return;
  document.addEventListener('pointermove',e=>{
    const c=e.target.closest('.card,.entry-card,.scope-group,.scn-card,.b-cell,.tech');
    if(!c) return;
    const r=c.getBoundingClientRect();
    c.style.setProperty('--mx',(e.clientX-r.left)+'px');
    c.style.setProperty('--my',(e.clientY-r.top)+'px');
  },{passive:true});
})();

buildDropdown();buildMobileNav();buildFooter();navigate();
</script>
